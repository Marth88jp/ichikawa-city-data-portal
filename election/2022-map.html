// 投票率→色（赤〜緑のグラデーション）
function rateToColor(rate) {
  const min = 26, max = 52; // 実データのレンジに基づく
  const t = Math.max(0, Math.min(1, (rate - min) / (max - min)));
  // 5段階補間（青=低 → 赤=高）
  const stops = [
    [0.00, [  8,  69, 148]],  // 濃青（低）
    [0.25, [ 99, 169, 214]],  // 水色
    [0.50, [255, 255, 191]],  // 薄黄（中央）
    [0.75, [253, 141,  60]],  // 橙
    [1.00, [179,   0,   0]],  // 濃赤（高）
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i][0] && t <= stops[i+1][0]) {
      const r = (t - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      const c = [0,1,2].map(k => Math.round(stops[i][1][k] + r * (stops[i+1][1][k] - stops[i][1][k])));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return 'rgb(128,128,128)';
}

// 有権者数→半径（面積が有権者数に比例）
function votersToRadius(voters) {
  const minV = 1000, maxV = 10000;
  const minR = 4, maxR = 16;
  const t = (voters - minV) / (maxV - minV);
  // 面積比例（sqrt）
  return minR + (maxR - minR) * Math.sqrt(Math.max(0, Math.min(1, t)));
}

    // 市川市（N03_007 = 12203）のフィーチャだけ抽出
    const ichikawa = {
      type: 'FeatureCollection',
      features: geo.features.filter(f => f.properties.N03_007 === '12203' || f.properties.N03_003 === '市川市')
    };
    L.geoJSON(ichikawa, {
      style: {
        color: '#1F4E78',
        weight: 2.5,
        opacity: 0.85,
        fillColor: '#1F4E78',
        fillOpacity: 0.04,
        dashArray: '6, 4',
      },
      interactive: false,
    }).addTo(map);
    console.log('市川市境界 読込成功: ' + ichikawa.features.length + ' features');
  })
  .catch(err => {
    console.warn('市川市境界の読込に失敗しました: ', err);
  });
