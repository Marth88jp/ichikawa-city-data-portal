const RATE_MIN = 22, RATE_MAX = 42;

function rateToColor(rate) {
  const t = Math.max(0, Math.min(1, (rate - RATE_MIN) / (RATE_MAX - RATE_MIN)));
  const stops = [
    [0.00, [  8,  69, 148]],
    [0.25, [ 99, 169, 214]],
    [0.50, [255, 255, 191]],
    [0.75, [253, 141,  60]],
    [1.00, [179,   0,   0]],
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i][0] && t <= stops[i+1][0]) {
      const r = (t - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      const c = [0,1,2].map(k => Math.round(stops[i][1][k] + r * (stops[i+1][1][k] - stops[i][1][k])));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return 'rgb(128,128,128)';
}

function votersToRadius(voters) {
  const minV = 1000, maxV = 10000;
  const minR = 5, maxR = 19;
  const t = (voters - minV) / (maxV - minV);
  return minR + (maxR - minR) * Math.sqrt(Math.max(0, Math.min(1, t)));
}

const map = L.map('map').setView([35.718, 139.930], 12);

L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  attribution: '地理院タイル (淡色地図)',
  maxZoom: 18
}).addTo(map);

fetch('https://raw.githubusercontent.com/smartnews-smri/japan-topography/main/data/municipality/geojson/s0010/N03-21_12_210101.json')
  .then(r => r.json())
  .then(geo => {
    const ichikawa = {
      type: 'FeatureCollection',
      features: geo.features.filter(f => f.properties.N03_007 === '12203' || f.properties.N03_003 === '市川市')
    };
    L.geoJSON(ichikawa, {
      style: { color: '#1F4E78', weight: 2.5, opacity: 0.85, fillColor: '#1F4E78', fillOpacity: 0.04, dashArray: '6, 4' },
      interactive: false,
    }).addTo(map);
  })
  .catch(err => console.warn('境界読込失敗:', err));

points.forEach(p => {
  const color = rateToColor(p.rate);
  const radius = votersToRadius(p.voters);
  const circle = L.circleMarker([p.lat, p.lng], {
    radius: radius, fillColor: color, color: '#333',
    weight: 1.2, opacity: 0.9, fillOpacity: 0.75,
  }).addTo(map);

  const rateColor = p.rate >= 36 ? '#d7191c' : (p.rate <= 26 ? '#2c7bb6' : '#888');
  const popup = `
    <div class="popup-content">
      <h3>${p.ku}. ${p.name}</h3>
      <div style="font-size:11px;color:#666;">${p.address}</div>
      <table>
        <tr><td>投票率（確定）</td><td style="color:${rateColor};font-size:16px;">${p.rate.toFixed(2)}%</td></tr>
        <tr><td>有権者数</td><td>${p.voters.toLocaleString()}人</td></tr>
        <tr><td>投票者総数</td><td>${p.turnout.toLocaleString()}人</td></tr>
        <tr><td>　うち投票所</td><td>${p.polling_turnout.toLocaleString()}人</td></tr>
        <tr><td>　うち期日前</td><td>${p.early.toLocaleString()}人（${p.early_ratio.toFixed(1)}%）</td></tr>
        <tr><td>　うち不在者</td><td>${p.absentee.toLocaleString()}人</td></tr>
        <tr><td>男性投票率</td><td>${p.rate_m.toFixed(2)}%</td></tr>
        <tr><td>女性投票率</td><td>${p.rate_f.toFixed(2)}%</td></tr>
      </table>
    </div>
  `;
  circle.bindPopup(popup);
  circle.bindTooltip(`${p.name}<br>投票率 ${p.rate.toFixed(2)}% / 有権者 ${p.voters.toLocaleString()}人`, {sticky: true});
});

const legend = L.control({position: 'bottomright'});
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <div class="legend-title">凡例（確定値）</div>
    <div><strong>色 = 投票率</strong></div>
    <div class="legend-gradient">
      <span>低</span><div class="gradient-bar"></div><span>高</span>
    </div>
    <div style="font-size:11px;color:#666;margin-bottom:8px;">
      22% <span style="margin-left:60px;">32%</span> <span style="margin-left:55px;">42%</span>
    </div>
    <div><strong>大きさ = 有権者数</strong></div>
    <div class="legend-size"><div class="size-circle" style="width:8px;height:8px;"></div><span>約1,500人</span></div>
    <div class="legend-size"><div class="size-circle" style="width:16px;height:16px;"></div><span>約5,000人</span></div>
    <div class="legend-size"><div class="size-circle" style="width:28px;height:28px;"></div><span>約9,000人</span></div>
    <div style="margin-top:8px;padding-top:6px;border-top:1px solid #ddd;">
      <div style="display:flex;align-items:center;gap:6px;">
        <svg width="24" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="#1F4E78" stroke-width="2.5" stroke-dasharray="6,4"/></svg>
        <span style="font-size:11px;">市川市行政界</span>
      </div>
      <div style="font-size:10px;color:#888;margin-top:4px;">出典: 国土交通省 国土数値情報 / 市川市選挙管理委員会</div>
    </div>
  `;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
