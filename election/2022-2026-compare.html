    [1.00, [179,   0,   0]],  // 深赤（比較的持ちこたえた）
  ];
  for (let i = 0; i < stops.length-1; i++) {
    if (t >= stops[i][0] && t <= stops[i+1][0]) {
      const r = (t - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      const c = [0,1,2].map(k => Math.round(stops[i][1][k] + r*(stops[i+1][1][k]-stops[i][1][k])));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return 'rgb(128,128,128)';
}

function votersToRadius(voters) {
  const minV=1000, maxV=10000, minR=5, maxR=19;
  const t=(voters-minV)/(maxV-minV);
  return minR+(maxR-minR)*Math.sqrt(Math.max(0,Math.min(1,t)));
}

const map = L.map('map').setView([35.718, 139.930], 12);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  attribution:'地理院タイル (淡色地図)', maxZoom:18
}).addTo(map);

fetch('https://raw.githubusercontent.com/smartnews-smri/japan-topography/main/data/municipality/geojson/s0010/N03-21_12_210101.json')
  .then(r=>r.json())
  .then(geo=>{
    const ic={type:'FeatureCollection',
               features:geo.features.filter(f=>f.properties.N03_007==='12203')};
    L.geoJSON(ic,{style:{color:'#1F4E78',weight:2.5,opacity:0.85,fillColor:'#1F4E78',fillOpacity:0.04,dashArray:'6,4'},interactive:false}).addTo(map);
  }).catch(e=>console.warn(e));

rows.forEach(p => {
  if (!p.lat || !p.lng) return;
  const color = changeToColor(p.change);
  const radius = votersToRadius(p.voters26);
  const circle = L.circleMarker([p.lat,p.lng],{
    radius, fillColor:color, color:'#333', weight:1.2, opacity:0.9, fillOpacity:0.8
  }).addTo(map);

  const changeClass = p.change < -9 ? 'change-small' : (p.change > -4 ? 'change-big' : '');
  const popup = `
    <div class="popup-content">
      <h3>${p.name}</h3>
      <table>
        <tr><td>2022年投票率</td><td>${p.rate22.toFixed(2)}%</td></tr>
        <tr><td>2026年投票率</td><td>${p.rate26.toFixed(2)}%</td></tr>
        <tr><td>変化</td><td class="${changeClass}" style="font-size:15px;">${p.change>0?'+':''}${p.change.toFixed(2)}pt</td></tr>
        <tr><td colspan="2" style="border-top:1px solid #eee;padding-top:4px;"></td></tr>
        <tr><td>2022有権者数</td><td>${p.voters22.toLocaleString()}人</td></tr>
        <tr><td>2026有権者数</td><td>${p.voters26.toLocaleString()}人</td></tr>
        <tr><td>期日前比率2022</td><td>${p.early22.toFixed(1)}%</td></tr>
        <tr><td>期日前比率2026</td><td>${p.early26.toFixed(1)}%</td></tr>
      </table>
    </div>`;
  circle.bindPopup(popup);
  circle.bindTooltip(
    `${p.name}<br>2022: ${p.rate22.toFixed(1)}% → 2026: ${p.rate26.toFixed(1)}%　<b>${p.change>0?'+':''}${p.change.toFixed(1)}pt</b>`,
    {sticky:true}
  );
});

const bounds = L.latLngBounds(rows.filter(p => p.lat && p.lng).map(p => [p.lat, p.lng]));
map.fitBounds(bounds, { padding: [10, 10] });

const legend = L.control({position:'bottomright'});
legend.onAdd = function() {
  const div = L.DomUtil.create('div','legend');
  div.innerHTML = `
    <div class="legend-title">凡例</div>
    <div><strong>色 = 投票率の変化量</strong></div>
    <div class="legend-gradient">
      <span style="font-size:10px;">大きく<br>低下</span>
      <div class="gradient-bar"></div>
      <span style="font-size:10px;">比較的<br>維持</span>
    </div>
    <div style="font-size:11px;color:#666;margin-bottom:8px;">
      ▲13pt &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ▲7pt &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ▲2pt
    </div>
    <div><strong>大きさ = 2026年有権者数</strong></div>
    <div class="legend-size"><div class="size-circle" style="width:10px;height:10px;"></div><span>約1,500人</span></div>
    <div class="legend-size"><div class="size-circle" style="width:18px;height:18px;"></div><span>約5,000人</span></div>
    <div class="legend-size"><div class="size-circle" style="width:28px;height:28px;"></div><span>約9,000人</span></div>
    <div style="margin-top:8px;padding-top:6px;border-top:1px solid #ddd;font-size:10px;color:#888;">
      出典: 市川市選挙管理委員会 / 国土交通省 国土数値情報
    </div>`;
  return div;
};
legend.addTo(map);
</script>
