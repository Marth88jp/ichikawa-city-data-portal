<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>市川市 データポータル</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
    margin: 0; padding: 0; background: #f3f5f7; color: #222;
  }
  .header {
    background: linear-gradient(135deg, #1F4E78 0%, #2E6DA4 100%);
    color: white; padding: 40px 24px 32px;
    text-align: center;
  }
  .header h1 { margin: 0; font-size: 26px; }
  .header .sub { font-size: 14px; opacity: 0.9; margin-top: 8px; }
  .container { max-width: 960px; margin: 0 auto; padding: 36px 20px 60px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  .card {
    display: block; background: white; border-radius: 14px;
    padding: 26px 22px; text-decoration: none; color: inherit;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative; overflow: hidden;
  }
  .card:not(.disabled):hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.14); }
  .card .icon { font-size: 34px; margin-bottom: 10px; display: block; }
  .card h2 { margin: 0 0 8px; font-size: 18px; color: #1F4E78; }
  .card p { margin: 0; font-size: 13px; color: #555; line-height: 1.6; }
  .card .count {
    display: inline-block; margin-top: 12px; font-size: 12px;
    background: #E7F0F7; color: #1F4E78; padding: 3px 10px; border-radius: 10px;
  }
  .card.disabled { opacity: 0.55; cursor: default; }
  .card.disabled .count { background: #EEE; color: #999; }
  .footer { text-align: center; font-size: 12px; color: #999; padding: 10px 20px 30px; }
</style>
</head>
<body>
<div class="header">
  <h1>📊 市川市 データポータル</h1>
  <div class="sub">市川市に関するオープンデータをジャンル別に可視化しています</div>
</div>

<div class="container">
  <div class="grid">

    <a class="card" href="election/">
      <span class="icon">🗳️</span>
      <h2>選挙結果</h2>
      <p>市長選挙の投票率を投票所単位で地図化。年度間の比較レポートも掲載。</p>
      <span class="count">3件のレポート</span>
    </a>

    <div class="card disabled">
      <span class="icon">👥</span>
      <h2>人口推移</h2>
      <p>町丁目別の人口・年齢構成の推移データ（準備中）</p>
      <span class="count">近日公開</span>
    </div>

    <div class="card disabled">
      <span class="icon">📹</span>
      <h2>防犯カメラ設置場所</h2>
      <p>市内の防犯カメラ設置箇所マップ（準備中）</p>
      <span class="count">近日公開</span>
    </div>

  </div>
</div>

<div class="footer">
  各レポートの詳細な出典はレポートページ内に記載しています。
</div>
</body>
</html>
